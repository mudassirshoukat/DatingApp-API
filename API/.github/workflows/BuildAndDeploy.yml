name: .NET CI/CD

# When should this pipeline run?
on:
  # push:            # run when code is pushed
    # branches:
      # - main
  # pull_request:    # also run for PRs
    # branches:
      # - main
  workflow_dispatch: # allow manual trigger

env:
  DOTNET_VERSION: "8.x"
  SOLUTION_PATH: "Api.sln"
  API_PROJECT_PATH: "Api"
  PUBLISH_DIR: "./publish"
  ARTIFACT_NAME: "webapp"
  AZURE_WEBAPP_NAME: "datingapp-api"   # must match your Azure Web App name

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Restore dependencies
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # 4. Build project
      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      # 5. Run tests
      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-restore --no-build --verbosity normal

      # 6. Publish build output (create ready-to-run files)
      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --no-restore --no-build --property:PublishDir=${{ env.PUBLISH_DIR }}

      # 7. Upload artifact (save for deploy job)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    name: Deploy to Azure WebApp
    runs-on: ubuntu-latest
    needs: build-test # wait until build-test job finishes

    steps:
      # 1. Download the artifact built above
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_DIR }}

      # 2. Deploy to Azure Web App
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
